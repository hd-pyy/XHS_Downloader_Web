<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>XHS Downloader · Web 版</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>XHS Downloader</h1>
    <span class="version">v0.1.0-web</span>
  </header>

  <main>
    <section class="input-card">
      <label for="text-input">请粘贴小红书分享文案或链接</label>
      <textarea
        id="text-input"
        rows="4"
        placeholder="例:✨端午... http://xhslink.com/o/2TuPol0My3z&#10;来【小红书】一探究竟吧！"
      ></textarea>
      <div class="actions">
        <button id="btn-parse" type="button">解析</button>
        <button id="btn-download" type="button" class="primary">下载到本机</button>
      </div>
      <p id="status" class="status"></p>
    </section>

    <section id="results-section" class="results" hidden>
      <h2>解析结果</h2>
      <div id="results"></div>
    </section>

    <section id="download-progress" class="progress-card" hidden>
      <h2>下载进度</h2>
      <div class="progress-text">正在解析 <span class="cur" id="dp-current">0</span>/<span class="total" id="dp-total">0</span></div>
      <div class="progress-bar-track"><div class="progress-bar-fill" id="dp-bar"></div></div>
      <div class="progress-subbar-row">
        <div class="progress-subbar-track" id="dp-subbar-wrap" hidden>
          <div class="progress-subbar-fill" id="dp-subbar"></div>
        </div>
        <div class="progress-detail" id="dp-detail">…</div>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
