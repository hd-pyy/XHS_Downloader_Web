# Nginx 反代模板 —— xhsdn-web
#
# 用法:
#   1. cp deploy/nginx.conf /etc/nginx/conf.d/xhsdn.conf
#   2. 把 xhs.example.cn 替换成你自己的备案域名
#   3. nginx -t && systemctl reload nginx
#   4. certbot --nginx -d xhs.example.cn  (会自动改这个文件加 SSL block)

server {
    listen 80;
    listen [::]:80;
    server_name xhs.example.cn;

    # Let's Encrypt 验证目录;certbot 会自动放挑战文件
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 其余请求统统跳 HTTPS (certbot --redirect 会自动加这条;手动也可加)
    location / {
        return 301 https://$host$request_uri;
    }
}

# 下面这个 server 块在 certbot 第一次跑完后会自动出现 (listen 443 ssl + ssl_certificate)。
# 这里先给个完整模板,certbot 会覆盖证书路径;若你手动管证书,直接用这个就行。
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xhs.example.cn;

    # certbot 会覆盖以下两行;手动管证书时填实际路径
    ssl_certificate     /etc/letsencrypt/live/xhs.example.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xhs.example.cn/privkey.pem;

    # 微信要求 TLS 1.2+;同时禁用老协议
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS (可选,但建议开;一旦开启就别再降级到 HTTP)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 一般安全头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 请求体上限 (本应用 /api/parse 默认 1mb,这里给 2mb 留 buffer)
    client_max_body_size 2m;

    # 流式响应 (proxy-video / SSE) 必须的几个参数
    proxy_buffering off;            # 关闭 Nginx buffer,字节直通
    proxy_request_buffering off;
    proxy_read_timeout 300s;        # 视频流最长 5 分钟
    proxy_send_timeout 300s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # 转发真实客户端信息 (Node 端 trust proxy=true 配合,用于限流取真实 IP)
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 日志 (按需打开)
    access_log /var/log/nginx/xhsdn.access.log;
    error_log  /var/log/nginx/xhsdn.error.log warn;

    # SSE 通道 (旧前端用,小程序用不到,但保留)
    location = /api/download/events {
        proxy_pass http://127.0.0.1:3030;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;     # SSE 长连接
        proxy_set_header Connection "";
    }

    # 视频代理 —— 大文件,允许 5 分钟传输
    location ~ ^/api/proxy-(image|video)$ {
        proxy_pass http://127.0.0.1:3030;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 所有其它请求 (含 /api/wx/parse, /api/parse, 静态前端等)
    location / {
        proxy_pass http://127.0.0.1:3030;
    }
}
